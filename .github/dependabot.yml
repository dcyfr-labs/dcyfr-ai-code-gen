version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10

    # vitest and @vitest/* must move in lockstep: @vitest/coverage-v8 pins
    # an exact `vitest` peer and refuses to run against a different version.
    # Ungrouped, Dependabot opens one PR per package and each fails alone;
    # that deadlocked vitest 5.0.1 in dcyfr-ai-docker and dcyfr-ai-kubernetes.
    # Tests here run under `bun test`, so today only @vitest/coverage-v8
    # matches; the group keeps the pair together if vitest is ever added.
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]

    labels:
      - "dependencies"
      - "automated"
      - "dependabot"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
      - "dependabot"
    commit-message:
      prefix: "ci"
    # changesets/action v2 requires @changesets/cli v3 and renamed several of
    # its inputs. Dependabot groups cannot span ecosystems, so this bump can
    # never be paired with the npm @changesets/cli bump: whichever lands first
    # breaks Release on main. That is exactly what happened across all ten
    # dcyfr-ai-* repos on 2026-08-22. Majors stay manual and must ship together
    # with the CLI bump; minor/patch updates still flow normally.
    ignore:
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
